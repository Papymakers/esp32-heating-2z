; =============================================================================
; platformio.ini — Naucrate 2 zones — ESP32 Heating Controller v5.1.6-2Z
; Un seul environnement : l'afficheur (OLED SH1106 ou TM1637) est détecté
; au démarrage, un même binaire sert les deux variantes (et sans afficheur).
; EEPROM 24C32 à 24C512 (adressage 16 bits), heure par NTP.
; ESP32-C6-DevKitC-1-N8 (8MB Flash)
; =============================================================================

[platformio]
default_envs = naucrate-2z

[env:naucrate-2z]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.06.10/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

upload_speed  = 921600
upload_port   = /dev/ttyUSB0

build_flags =
    -DARDUINO_ESP32_C6_DEVKITC_1
    -DCORE_DEBUG_LEVEL=0
    ; U8g2 ne reprogramme pas l'horloge I2C à chaque transfert :
    ; bus partagé avec l'EEPROM, déjà réglé à 400 kHz par Wire.begin()
    -DU8X8_DO_NOT_SET_WIRE_CLOCK
    -I include

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
    olikraus/U8g2 @ ^2.35.30
    https://github.com/Erriez/ErriezTM1637.git
